name: CI and Release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install quality tools
        run: |
          homebrew_repository=$(brew --repository)
          if [[ -d "$homebrew_repository/Library/Taps/aws/homebrew-tap" ]]; then
            brew untap aws/tap
          fi
          brew install shellcheck shfmt swiftformat swiftlint

      - name: Check Swift formatting
        run: swiftformat Sources Tests Icon --lint --cache ignore

      - name: Lint Swift
        run: swiftlint lint --strict --no-cache Sources Tests Icon

      - name: Check build script
        run: |
          shellcheck build.sh Scripts/check-coverage.sh
          shfmt -d -i 2 build.sh Scripts/check-coverage.sh

      - name: Test and check coverage
        run: Scripts/check-coverage.sh

      - name: Build release configuration
        run: swift build -c release -Xswiftc -warnings-as-errors

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$certificate_path"
          security create-keychain -p "temporary-password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "temporary-password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "temporary-password" "$keychain_path"

      - name: Build app bundle
        run: CI=1 ./build.sh

      - name: Sign and verify app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          /usr/bin/codesign --force --options runtime --timestamp \
            --keychain "$RUNNER_TEMP/build.keychain-db" \
            --sign "$MACOS_CODESIGN_IDENTITY" Weathervane.app
          /usr/bin/codesign --verify --deep --strict --verbose=4 Weathervane.app

      - name: Notarize and staple app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_API_ISSUER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          ditto -c -k --keepParent Weathervane.app notarization.zip
          xcrun notarytool submit notarization.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple Weathervane.app
          xcrun stapler validate Weathervane.app
          /usr/bin/codesign --verify --deep --strict --verbose=4 Weathervane.app
          spctl --assess --type execute --verbose=4 Weathervane.app

      - name: Create archive
        run: ditto -c -k --keepParent Weathervane.app Weathervane.zip

      - name: Extract version from tag
        id: version
        run: printf 'version=%s\n' "${GITHUB_REF#refs/tags/v}" >>"$GITHUB_OUTPUT"

      - name: Delete temporary keychain
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          certificate_path="$RUNNER_TEMP/certificate.p12"
          if [[ -e "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          if [[ -e "$certificate_path" ]]; then
            find "$certificate_path" -delete
          fi

      - name: Create release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: Weathervane.zip
          body: |
            Weathervane ${{ steps.version.outputs.version }}

            Download Weathervane.zip, unzip it, and move Weathervane.app to Applications.
